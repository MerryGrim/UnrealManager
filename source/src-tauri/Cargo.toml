[package]
name = "unreal-manager"
version = "0.9.0"
description = "Lightweight Unreal Engine manager"
authors = ["Nyanma <https://github.com/MerryGrim>"]
edition = "2021"
license = "MIT"

[lib]
name = "unreal_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "=1.0.28"
walkdir = "2"
dirs = "6"
egs-api = "=0.14.0"
reqwest = { version = "0.13", features = ["json", "query"] }
tokio = { version = "1", features = ["sync", "time"] }
webbrowser = "1"
uuid = { version = "1", features = ["v4"] }
sha1 = "0.10"
sha2 = "=0.10.9"
chrono = "=0.4.45"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_JobObjects"] }


[features]
engine-test-cli = []
